<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso · RunaMarca</title><style>
:root{color-scheme:dark;font-family:Georgia,serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#303b30,#111914 67%);color:#f3e7c8;padding:20px}main{width:min(430px,100%);background:#1b271f;border:1px solid #9b7949;border-radius:20px;padding:34px;box-shadow:0 24px 80px #0008;text-align:center}small{letter-spacing:.2em;color:#c6a46e}h1{font-size:2.6rem;margin:.4em 0}p{line-height:1.5;color:#d4c8ab}label{display:block;text-align:left;margin-top:25px}input{display:block;width:100%;margin-top:9px;padding:14px;background:#0e1712;border:1px solid #9b7949;border-radius:8px;color:#fff;font:1.2rem sans-serif;letter-spacing:.1em}button{width:100%;margin-top:15px;padding:14px;background:#b8935e;border:0;border-radius:8px;color:#101913;font-weight:700;cursor:pointer}a{display:inline-block;color:#d4b782;margin-top:25px}#error{min-height:1.4em;color:#ffad9d}
</style></head><body><main><small>CONTRATO DE CAÇADA</small><h1>RunaMarca</h1><p>Informe o código para entrar na mesa.</p><form id="gate"><label>Código de acesso<input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="8" required autofocus></label><button>Entrar no jogo</button><p id="error" role="alert"></p></form><a href="/">Voltar aos jogos</a></main><script>
document.getElementById('gate').addEventListener('submit',async event=>{event.preventDefault();const error=document.getElementById('error');error.textContent='';try{const response=await fetch('access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'Acesso negado.');location.replace('./');}catch(e){error.textContent=e.message;}});
</script></body></html>
