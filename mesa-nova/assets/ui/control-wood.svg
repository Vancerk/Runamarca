 <path d="M9 1H183Q190 1 190 8V61Q190 68 183 68H9Q2 68 2 61V8Q2 1 9 1Z" fill="url(#edge)"/>
 <path d="M10 4H182Q188 4 188 10V61Q188 66 182 66H10Q4 66 4 61V10Q4 4 10 4Z" fill="none" stroke="url(#silver)" stroke-width="1.1"/>
 <path d="M10 5H182Q187 5 187 10V61Q187 65 182 65H10Q5 65 5 61V10Q5 5 10 5Z" fill="url(#face)"/>
 <g clip-path="url(#inset)">
