<svg xmlns="http://www.w3.org/2000/svg" width="192" height="72" viewBox="0 0 192 72">
 <!-- Claude round 3 (owner): one piece of solid wood — face, bevel and thickness — with a thin inlay of polished silver
      (light/dark/light like real metal) instead of a flat metallic outline. Procedural grain, no raster asset. -->
 <defs>
  <linearGradient id="face" x1="0" y1="0" x2=".08" y2="1"><stop stop-color="#c99460"/><stop offset=".5" stop-color="#b8824f"/><stop offset="1" stop-color="#a06c3e"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9dee2"/><stop offset=".3" stop-color="#7f878e"/><stop offset=".52" stop-color="#c3c9ce"/><stop offset=".8" stop-color="#5b6268"/><stop offset="1" stop-color="#a9b0b6"/></linearGradient>
  <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#5a341a"/><stop offset="1" stop-color="#2a170c"/></linearGradient>
  <clipPath id="inset"><path d="M10 5H182Q187 5 187 10V61Q187 65 182 65H10Q5 65 5 61V10Q5 5 10 5Z"/></clipPath>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".011 .26" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .17  0 0 0 0 .09  0 0 0 0 .04  0 0 0 -1.6 1.05"/></filter>
  <filter id="rings" x="0" y="0" width="100%" height="100%"><feTurbulence type="turbulence" baseFrequency=".006 .09" numOctaves="2" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .06  0 0 0 0 .02  0 0 0 -2.2 .62"/></filter>
 </defs>
