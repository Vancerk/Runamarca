<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baralho e fadiga — RunaMarca</title><link rel="stylesheet" href="mesa-central.css?v=20261018-revisao"><script src="sfx-player.js" defer></script><script src="deck-feedback.js" defer></script><script src="baralho-fadiga.js" defer></script><style>body{margin:0;background:#1c1714;color:#f5e8ce;font:16px/1.5 system-ui}main{max-width:900px;margin:auto;padding:32px}h1{font-family:Georgia}.sample{position:relative;display:flex;align-items:center;justify-content:center;gap:180px;min-height:300px;background:radial-gradient(ellipse,#60503a,#30251d);border:1px solid #9d8050;border-radius:18px}.sample .deck-mount{position:relative;inset:auto;width:72px;height:110px}.sample .deck-stack{width:70px;height:100px;transform:rotate(4deg)}.patron-card{width:110px;height:150px;border:3px double #d8b779;border-radius:48% 48% 12px 12px;overflow:hidden}.patron-card img{width:100%;height:100%;object-fit:cover}.health{text-align:center;font:bold 24px Georgia;margin-top:12px}.actions{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}button{background:#493623;color:#fff0ce;border:1px solid #967548;border-radius:7px;padding:12px;font:inherit;cursor:pointer}#visual-layer{position:fixed;inset:0;pointer-events:none;z-index:500}.hint{color:#cbbb9e}a{color:#ffdf9c}</style></head><body><main><h1>Baralho e fadiga</h1><p>Passe o mouse sobre o baralho ou selecione-o com Tab. Compre cartas para observar a pilha diminuindo.</p><div class="sample"><div><div class="patron-card"><img src="patrons/bigorna-desperta-nova.png" alt="Lyrik"></div><div class="health">16 de vida</div></div><div class="deck-mount"><div class="deck-stack" tabindex="0"><img src="card-back.png" alt="Baralho"><span class="deck-count-tooltip"></span></div></div></div><div class="actions"><button id="draw">Comprar 5 cartas</button><button id="empty">Esvaziar baralho</button><button id="fatigue">Sofrer fadiga</button><button id="reset">Reiniciar</button></div><p id="status" role="status"></p><p class="hint">Bancada visual: usa o mesmo componente de fadiga do jogo. Não altera partidas. A fadiga cresce de 1 para 2, 3, 4, 5…</p><a href="./">Voltar ao jogo</a></main><div id="visual-layer"></div></body></html>
